name: Single Run
on:
  workflow_dispatch:
    inputs:
      course_ids:
        required: true
        type: string
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openai requests pycryptodome pillow imagehash
      - name: Read encrypted database
        env:
          STUID: ${{ secrets.STUID }}
          UISPSW: ${{ secrets.UISPSW }}
        run: |
          git fetch --depth=1 origin data
          git checkout origin/data -- data
          python scripts/db_shard.py reassemble data data/icourse.db
      - name: Compare models without changing database or sending mail
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u scripts/compare_os_models.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: os-h-model-comparison
          path: comparison/
          retention-days: 7
